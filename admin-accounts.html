<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <script src="api-config.js" defer></script>
  <script src="api.js" defer></script>
  <script src="app.js" defer></script>
  <title>Accounts | MineSafe</title>
</head>
<body class="admin-workspace-page">
  <header class="admin-header">
    <h1>MineSafe administration</h1>
    <nav aria-label="Administration">
      <a href="sign-in.html" data-logout>Log out</a>
    </nav>
  </header>
  <main class="admin-workspace">
    <h2>Accounts</h2>
    <div class="admin-shell">
      <section class="admin-filters-pane" aria-label="Accounts search and filters">
    <form id="account-filters" class="admin-filter-form" role="search" method="get" action="admin-accounts.html">
      <p><label for="account-search">Search accounts</label><input id="account-search" name="search" type="search" placeholder="Name, Worker ID or email"></p>
      <p><label for="account-role-filter">Role</label><select id="account-role-filter" name="roleId"><option value="">All roles</option></select></p>
      <p><label for="account-active-filter">Account status</label><select id="account-active-filter" name="status"><option value="all">Active and inactive</option><option value="active">Active</option><option value="inactive">Inactive</option></select></p>
      <div class="admin-filter-actions"><button type="submit">Apply filters</button><button id="clear-account-filters" class="secondary-button" type="button">Clear</button><button id="refresh-accounts" class="secondary-button" type="button">Refresh</button></div>
    </form></section>
      <nav class="admin-side-nav" aria-label="Management pages"><a href="admin-locations.html">Locations</a></nav>
      <div class="admin-create-pane">
        <a class="admin-create-link" href="admin-account-create.html">Create new account</a>

      </div>
      <section class="admin-content-pane" aria-label="Accounts list">
        <h3 id="account-list-heading">Account list</h3>
<p id="account-list-message" role="status" aria-live="polite">Accounts have not been loaded yet.</p>
<table><caption>Worker accounts</caption><thead><tr>
  <th scope="col">Worker ID</th><th scope="col">Full name</th><th scope="col">Email</th>
  <th scope="col">Roles</th><th scope="col">Locations</th><th scope="col">Status</th><th scope="col">Actions</th>
</tr></thead><tbody id="account-rows"></tbody></table>
      </section>
    </div>
  </main>
</body>
</html>
